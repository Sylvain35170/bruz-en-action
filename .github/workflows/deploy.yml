name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Les pages /coup-de-pouce, / et /agenda filtrent sur la date du jour, évaluée
  # au build puisque l'export est statique. Sans rebuild périodique, un item
  # échu (`date_fin`) ou un événement passé resterait affiché comme actuel.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider data/*.json
        run: python3 scripts/validate_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
